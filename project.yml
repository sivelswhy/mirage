name: Mirage
options:
  bundleIdPrefix: io.pivo
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_HARDENED_RUNTIME: YES
    CODE_SIGN_ENTITLEMENTS: Resources/Mirage.entitlements
    INFOPLIST_KEY_NSHumanReadableCopyright: ""
    INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools

targets:
  Mirage:
    type: application
    platform: macOS
    sources:
      - path: Sources/Mirage
      - path: Sources/Shared
      # Référence de dossier : la hiérarchie de l'interpréteur est copiée telle
      # quelle, au lieu d'être aplatie fichier par fichier dans Resources.
      - path: Resources/backend
        type: folder
        buildPhase: resources
        optional: true
    dependencies:
      - target: MirageHelper
        embed: false
    postBuildScripts:
      - name: Installe le démon et son plist
        script: |
          CONTENTS="$BUILT_PRODUCTS_DIR/$CONTENTS_FOLDER_PATH"
          mkdir -p "$CONTENTS/Library/LaunchDaemons"
          cp "$SRCROOT/Resources/LaunchDaemons/io.pivo.Mirage.Helper.plist" \
             "$CONTENTS/Library/LaunchDaemons/"
          cp "$BUILT_PRODUCTS_DIR/MirageHelper" "$CONTENTS/MacOS/MirageHelper"
    info:
      path: Resources/Info.plist
      properties:
        CFBundleName: Mirage
        CFBundleDisplayName: Mirage
        LSMinimumSystemVersion: "26.0"
        NSLocationUsageDescription: Mirage affiche la carte autour de votre position.
        NSHumanReadableCopyright: ""
    entitlements:
      path: Resources/Mirage.entitlements
      properties:
        com.apple.security.app-sandbox: false
        com.apple.security.network.client: true
        com.apple.security.cs.allow-jit: true
        com.apple.security.cs.disable-library-validation: true

  MirageHelper:
    type: tool
    platform: macOS
    sources:
      - path: Sources/MirageHelper
      - path: Sources/Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.pivo.Mirage.Helper
        SWIFT_VERSION: "6.0"
        # Le démon est un exécutable simple, pas un bundle : son Info.plist est
        # incorporé dans le binaire par le linker.
        CREATE_INFOPLIST_SECTION_IN_BINARY: YES
        INFOPLIST_KEY_CFBundleIdentifier: io.pivo.Mirage.Helper
