name: Mirage
options:
  bundleIdPrefix: io.pivo
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_HARDENED_RUNTIME: YES
    CODE_SIGN_ENTITLEMENTS: Resources/Mirage.entitlements
    INFOPLIST_KEY_NSHumanReadableCopyright: ""
    INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools

targets:
  Mirage:
    type: application
    platform: macOS
    sources:
      - path: Sources/Mirage
      # Référence de dossier : la hiérarchie du venv est copiée telle quelle,
      # au lieu d'être aplatie fichier par fichier dans Resources.
      - path: Resources/backend
        type: folder
        buildPhase: resources
        optional: true
    info:
      path: Resources/Info.plist
      properties:
        CFBundleName: Mirage
        CFBundleDisplayName: Mirage
        LSMinimumSystemVersion: "26.0"
        NSLocationUsageDescription: Mirage affiche la carte autour de votre position.
        NSHumanReadableCopyright: ""
    entitlements:
      path: Resources/Mirage.entitlements
      properties:
        com.apple.security.app-sandbox: false
        com.apple.security.network.client: true
        com.apple.security.cs.allow-jit: true
        com.apple.security.cs.disable-library-validation: true
