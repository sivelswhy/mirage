name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    runs-on: macos-26
    # Le jeton du workflow est en lecture seule par défaut : sans cela,
    # la création de release échoue en 403.
    permissions:
      contents: write
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Sélectionne le Xcode le plus récent
        run: |
          ls -d /Applications/Xcode*.app || true
          LATEST=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
          if [[ -n "$LATEST" ]]; then sudo xcode-select -s "$LATEST"; fi
          xcodebuild -version
          xcodebuild -showsdks | grep -i macos || true

      - name: Calcule la version
        id: version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            VERSION="0.0.${GITHUB_RUN_NUMBER}-dev"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Installe XcodeGen
        run: brew install xcodegen

      - name: Embarque un interpréteur relocalisable
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/fetch-python.sh

      - name: Génère le projet
        run: xcodegen generate

      - name: Compile
        run: |
          xcodebuild \
            -project Mirage.xcodeproj \
            -scheme Mirage \
            -configuration Release \
            -derivedDataPath build \
            MARKETING_VERSION="${{ steps.version.outputs.version }}" \
            CURRENT_PROJECT_VERSION="${GITHUB_RUN_NUMBER}" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Signature ad hoc
        run: |
          APP=build/Build/Products/Release/Mirage.app
          BACKEND="$APP/Contents/Resources/backend"

          # Chaque binaire Mach-O embarqué doit être signé avant le bundle,
          # sinon la signature du conteneur est rejetée à l'exécution.
          find "$BACKEND" -type f \( -name '*.dylib' -o -name '*.so' \) \
            -exec codesign --force --sign - {} + || true
          find "$BACKEND/bin" -type f -perm -u+x \
            -exec codesign --force --sign - {} + || true

          codesign --force --deep --sign - "$APP"
          codesign --verify --deep --verbose=2 "$APP"

      - name: Fabrique le DMG
        run: |
          APP=build/Build/Products/Release/Mirage.app
          STAGE=$(mktemp -d)
          cp -R "$APP" "$STAGE/"
          ln -s /Applications "$STAGE/Applications"
          hdiutil create \
            -volname "Mirage" \
            -srcfolder "$STAGE" \
            -ov -format UDZO \
            "Mirage-${{ steps.version.outputs.version }}.dmg"
          shasum -a 256 Mirage-*.dmg > SHA256SUMS.txt

      - name: Publie l'artefact de build
        uses: actions/upload-artifact@v4
        with:
          name: Mirage-${{ steps.version.outputs.version }}
          path: |
            Mirage-*.dmg
            SHA256SUMS.txt
          retention-days: 30

      - name: Publie la release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Mirage-*.dmg
            SHA256SUMS.txt
          generate_release_notes: true
          body: |
            Application non notarisée. Au premier lancement, macOS la bloquera.

            ```
            xattr -dr com.apple.quarantine /Applications/Mirage.app
            ```
