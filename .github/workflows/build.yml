name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    runs-on: macos-26
    # Le jeton du workflow est en lecture seule par défaut : sans cela,
    # la création de release échoue en 403.
    permissions:
      contents: write
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Sélectionne le Xcode le plus récent
        run: |
          ls -d /Applications/Xcode*.app || true
          LATEST=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
          if [[ -n "$LATEST" ]]; then sudo xcode-select -s "$LATEST"; fi
          xcodebuild -version
          xcodebuild -showsdks | grep -i macos || true

      - name: Calcule la version
        id: version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            VERSION="0.0.${GITHUB_RUN_NUMBER}-dev"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Installe XcodeGen
        run: brew install xcodegen

      - name: Embarque un interpréteur relocalisable
        run: |
          # Un venv encode des chemins absolus vers la machine de build : il ne
          # survit pas au transport. python-build-standalone, lui, est conçu
          # pour être déplacé n'importe où.
          ASSET=$(curl -fsSL \
            https://api.github.com/repos/astral-sh/python-build-standalone/releases/latest \
            | python3 -c '
import json, sys
assets = json.load(sys.stdin)["assets"]
for version in ("cpython-3.12", "cpython-3.13", "cpython-3.11"):
    for a in assets:
        n = a["name"]
        if n.startswith(version) and n.endswith("aarch64-apple-darwin-install_only.tar.gz"):
            print(a["browser_download_url"]); sys.exit(0)
sys.exit("aucune distribution compatible trouvée")')

          echo "Distribution : $ASSET"
          curl -fsSL "$ASSET" -o /tmp/python.tar.gz
          rm -rf Resources/backend python
          mkdir -p Resources
          tar -xzf /tmp/python.tar.gz
          mv python Resources/backend

          Resources/backend/bin/python3 -m pip install --quiet --upgrade pip
          Resources/backend/bin/python3 -m pip install --quiet pymobiledevice3
          Resources/backend/bin/python3 -m pymobiledevice3 version

          # Allège le bundle : caches, tests et en-têtes de compilation.
          find Resources/backend -name '__pycache__' -type d -prune -exec rm -rf {} + || true
          rm -rf Resources/backend/include Resources/backend/share || true

      - name: Génère le projet
        run: xcodegen generate

      - name: Compile
        run: |
          xcodebuild \
            -project Mirage.xcodeproj \
            -scheme Mirage \
            -configuration Release \
            -derivedDataPath build \
            MARKETING_VERSION="${{ steps.version.outputs.version }}" \
            CURRENT_PROJECT_VERSION="${GITHUB_RUN_NUMBER}" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Signature ad hoc
        run: |
          APP=build/Build/Products/Release/Mirage.app
          BACKEND="$APP/Contents/Resources/backend"

          # Chaque binaire Mach-O embarqué doit être signé avant le bundle,
          # sinon la signature du conteneur est rejetée à l'exécution.
          find "$BACKEND" -type f \( -name '*.dylib' -o -name '*.so' \) \
            -exec codesign --force --sign - {} + || true
          find "$BACKEND/bin" -type f -perm -u+x \
            -exec codesign --force --sign - {} + || true

          codesign --force --deep --sign - "$APP"
          codesign --verify --deep --verbose=2 "$APP"

      - name: Fabrique le DMG
        run: |
          APP=build/Build/Products/Release/Mirage.app
          STAGE=$(mktemp -d)
          cp -R "$APP" "$STAGE/"
          ln -s /Applications "$STAGE/Applications"
          hdiutil create \
            -volname "Mirage" \
            -srcfolder "$STAGE" \
            -ov -format UDZO \
            "Mirage-${{ steps.version.outputs.version }}.dmg"
          shasum -a 256 Mirage-*.dmg > SHA256SUMS.txt

      - name: Publie l'artefact de build
        uses: actions/upload-artifact@v4
        with:
          name: Mirage-${{ steps.version.outputs.version }}
          path: |
            Mirage-*.dmg
            SHA256SUMS.txt
          retention-days: 30

      - name: Publie la release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Mirage-*.dmg
            SHA256SUMS.txt
          generate_release_notes: true
          body: |
            Application non notarisée. Au premier lancement, macOS la bloquera.

            ```
            xattr -dr com.apple.quarantine /Applications/Mirage.app
            ```
